services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: docpulse
      POSTGRES_PASSWORD: docpulse
      POSTGRES_DB: docpulse
    ports:
      - "5432:5432"
    volumes:
      - docpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpulse -d docpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://docpulse:docpulse@db:5432/docpulse
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  docpulse_pgdata:
