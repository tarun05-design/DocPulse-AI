<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="DocPulse AI dashboard — analytics overview of your documents" />
<title>DocPulse AI · Dashboard</title>
<link rel="stylesheet" href="css/style.css?v=20260804" />
<style>
  /* ─── Guaranteed Overview Stat Grid & Profile Dropdown Styles ─── */
  .stat-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)) !important;
    gap: 16px !important;
    margin-top: 12px !important;
  }

  .stat-card {
    background: rgba(255, 255, 255, 0.03) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 12px !important;
    padding: 20px 22px !important;
    display: flex !important;
    align-items: center !important;
    gap: 16px !important;
    transition: all 0.3s ease !important;
    position: relative !important;
    overflow: hidden !important;
  }

  .stat-card:hover {
    transform: translateY(-3px) !important;
    border-color: rgba(99, 102, 241, 0.4) !important;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(99, 102, 241, 0.15) !important;
    background: rgba(255, 255, 255, 0.05) !important;
  }

  .stat-card-icon {
    width: 46px !important;
    height: 46px !important;
    border-radius: 12px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex-shrink: 0 !important;
  }

  .stat-card-icon.blue { background: rgba(99, 102, 241, 0.15) !important; border: 1px solid rgba(99, 102, 241, 0.3) !important; color: #818cf8 !important; }
  .stat-card-icon.green { background: rgba(16, 185, 129, 0.15) !important; border: 1px solid rgba(16, 185, 129, 0.3) !important; color: #34d399 !important; }
  .stat-card-icon.purple { background: rgba(168, 85, 247, 0.15) !important; border: 1px solid rgba(168, 85, 247, 0.3) !important; color: #c084fc !important; }
  .stat-card-icon.rose { background: rgba(244, 63, 94, 0.15) !important; border: 1px solid rgba(244, 63, 94, 0.3) !important; color: #fb7185 !important; }

  .stat-card-info {
    display: flex !important;
    flex-direction: column !important;
    gap: 2px !important;
  }

  .stat-card-num {
    font-size: 1.75rem !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    line-height: 1.1 !important;
    letter-spacing: -0.02em !important;
  }

  .stat-card-label {
    font-size: 0.8rem !important;
    font-weight: 600 !important;
    color: #94a3b8 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.04em !important;
  }

  /* Profile Dropdown Override */
  .profile-menu {
    width: 220px !important;
    padding: 8px !important;
    background: #0f121d !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-radius: 12px !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
  }

  .profile-menu-header {
    padding: 10px 12px !important;
    border-bottom: 1px solid rgba(255,255,255,0.08) !important;
    margin-bottom: 4px !important;
  }

  .profile-menu-header .name {
    font-weight: 700 !important;
    font-size: 0.9rem !important;
    color: #ffffff !important;
  }

  .profile-menu-header .email {
    font-size: 0.76rem !important;
    color: #94a3b8 !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
    margin-top: 2px !important;
  }

  .profile-menu-divider {
    height: 1px !important;
    background: rgba(255,255,255,0.08) !important;
    margin: 4px 0 !important;
  }

  .profile-menu a, .profile-menu button {
    display: flex !important;
    align-items: center !important;
    gap: 10px !important;
    padding: 10px 12px !important;
    border-radius: 6px !important;
    color: #cbd5e1 !important;
    font-size: 0.88rem !important;
    font-weight: 500 !important;
    text-decoration: none !important;
    background: transparent !important;
    border: none !important;
    width: 100% !important;
    text-align: left !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
  }

  .profile-menu a:hover, .profile-menu button:hover {
    background: rgba(255, 255, 255, 0.08) !important;
    color: #ffffff !important;
  }

  .profile-menu .logout-item {
    color: #f87171 !important;
  }

  .profile-menu .logout-item:hover {
    background: rgba(239, 68, 68, 0.15) !important;
    color: #fca5a5 !important;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="brand"><div class="dot-logo"></div>DocPulse AI</a>
    <nav></nav>
  </div>

  <div class="container">
    <!-- Greeting -->
    <div class="card">
      <h1>Dashboard</h1>
      <p class="greeting" id="greeting"></p>
    </div>

    <!-- Stats -->
    <div class="card">
      <h2>Overview</h2>
      <div class="stat-grid" id="statGrid">
        <div class="page-loader" style="grid-column:1/-1;">
          <div class="spinner-ring"></div>
          Loading stats…
        </div>
      </div>
    </div>

    <!-- Status Breakdown -->
    <div class="card">
      <h2>By Status</h2>
      <div id="statusBreakdown" class="muted">
        <div class="page-loader"><div class="spinner-ring"></div></div>
      </div>
    </div>

    <!-- Type Breakdown -->
    <div class="card">
      <h2>By Document Type</h2>
      <div id="typeBreakdown" class="muted">
        <div class="page-loader"><div class="spinner-ring"></div></div>
      </div>
    </div>

    <!-- Recent Documents -->
    <div class="card">
      <h2>Recent Documents</h2>
      <div id="recentContent">
        <div class="page-loader"><div class="spinner-ring"></div>Loading…</div>
      </div>
    </div>
  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="brand-signature">
        <div class="dot-logo"></div>
        <strong>DocPulse AI</strong> — Engineered by Tarun P
      </div>
      <div style="display:flex;gap:20px;">
        <a href="index.html">Home</a>
        <a href="upload.html">Workspace</a>
        <a href="dashboard.html">Dashboard</a>
      </div>
    </div>
  </footer>

  <script src="js/api.js?v=20260804"></script>
  <script>
    requireAuth();
    const logoutBtn = document.getElementById("logoutLink");
    if (logoutBtn) logoutBtn.addEventListener("click", confirmLogout);

    // Greeting
    const user = getUser();
    const hour = new Date().getHours();
    const greetWord = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    document.getElementById("greeting").innerHTML =
      `${greetWord}, <strong>${user ? user.name : "there"}</strong>. Here's your document overview.`;

    function buildProgressBar(count, total, color) {
      const pct = total > 0 ? (count / total * 100) : 0;
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <span style="font-size:0.88rem;font-weight:500;text-transform:capitalize;">${color.label}</span>
          <span class="muted" style="font-size:0.82rem;">${count}</span>
        </div>
        <div class="progress-bar" style="margin-top:0;margin-bottom:16px;">
          <div class="fill" style="width:${pct}%;background:${color.bg};"></div>
        </div>
      `;
    }

    async function loadDashboard() {
      try {
        const d = await Api.dashboardSummary();

        // Stats
        const processed = d.by_status?.processed || 0;
        const failed = d.by_status?.failed || 0;
        document.getElementById("statGrid").innerHTML = `
          <div class="stat-card">
            <div class="stat-card-icon blue">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="stat-card-info">
              <div class="stat-card-num num">${d.total_documents}</div>
              <div class="stat-card-label">Total Documents</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon green">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="stat-card-info">
              <div class="stat-card-num num">${processed}</div>
              <div class="stat-card-label">Processed</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon purple">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div class="stat-card-info">
              <div class="stat-card-num num">${d.total_chat_messages}</div>
              <div class="stat-card-label">Chat Messages</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon rose">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <div class="stat-card-info">
              <div class="stat-card-num num">${failed}</div>
              <div class="stat-card-label">Failed</div>
            </div>
          </div>
        `;

        // Animate counters
        document.querySelectorAll('.stat-card .num').forEach(el => {
          const target = parseInt(el.textContent);
          if (isNaN(target) || target === 0) return;
          el.textContent = '0';
          let current = 0;
          const step = Math.max(1, Math.ceil(target / 30));
          const interval = setInterval(() => {
            current = Math.min(current + step, target);
            el.textContent = current;
            if (current >= target) clearInterval(interval);
          }, 30);
        });

        // Status breakdown with progress bars
        const statusColors = {
          processed:  { label: "Processed",  bg: "var(--gradient-brand)" },
          processing: { label: "Processing", bg: "linear-gradient(90deg, #f5c05a, #ffa06b)" },
          uploaded:   { label: "Uploaded",   bg: "var(--gradient-purple)" },
          failed:     { label: "Failed",     bg: "var(--gradient-warm)" },
        };
        const statusEntries = Object.entries(d.by_status || {});
        document.getElementById("statusBreakdown").innerHTML = statusEntries.length
          ? statusEntries.map(([k, v]) =>
              buildProgressBar(v, d.total_documents, statusColors[k] || { label: k, bg: "var(--gradient-brand)" })
            ).join("")
          : '<p class="muted">No data yet.</p>';

        // Type breakdown
        const typeEntries = Object.entries(d.by_type || {});
        const typeColors = {
          invoice: "var(--gradient-brand)", contract: "var(--gradient-purple)",
          resume: "linear-gradient(90deg,#5ee6c8,#6c8cff)", report: "linear-gradient(90deg,#f5c05a,#ff6b6b)",
          other: "linear-gradient(90deg,#8b95a5,#5a6374)",
        };
        document.getElementById("typeBreakdown").innerHTML = typeEntries.length
          ? typeEntries.map(([k, v]) =>
              buildProgressBar(v, d.total_documents, { label: k || "unknown", bg: typeColors[k] || typeColors.other })
            ).join("")
          : '<p class="muted">No data yet.</p>';

        // Recent documents
        const recentContainer = document.getElementById("recentContent");
        if (d.recent_documents && d.recent_documents.length) {
          recentContainer.innerHTML = `
            <table>
              <thead>
                <tr><th>Document</th><th>Type</th><th>Status</th><th></th></tr>
              </thead>
              <tbody>
                ${d.recent_documents.map(doc => `
                  <tr>
                    <td style="font-weight:500;">${doc.filename}</td>
                    <td><span class="badge">${doc.doc_type || "unknown"}</span></td>
                    <td><span class="badge ${doc.status}">${doc.status}</span></td>
                    <td><a href="chat.html?doc=${doc.id}" style="font-size:0.85rem;font-weight:500;">Chat →</a></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        } else {
          recentContainer.innerHTML = `
            <div class="empty-state">
              <div class="icon">📊</div>
              <h3>No documents yet</h3>
              <p>Upload some documents to see analytics here.</p>
            </div>
          `;
        }
      } catch (e) {
        document.getElementById("statGrid").innerHTML = `<p class="error">${e.message}</p>`;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
